server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Sin esto, las redirecciones (p.ej. /blog -> /blog/ por try_files) se
    # construyen con $scheme y $server_port, que aqui son los internos
    # (http, 8080) y no los que ve el navegador a traves de Caddy. El
    # resultado es un Location: http://localhost:8080/... que el navegador
    # no puede alcanzar. Con la redireccion relativa, el navegador la
    # resuelve contra la URL que ya tiene delante.
    absolute_redirect off;

    # Nginx solo es alcanzable desde la red interna, y ahi el unico cliente es
    # Caddy. Confiar en los rangos privados permite que el log registre la IP
    # real del visitante en vez de la del proxy.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Ficheros ocultos: va primero porque las location de regex se evaluan en
    # orden y la primera que casa gana.
    location ~ /\. {
        deny all;
        access_log off;
    }

    # rss.xml es el unico XML que necesita su propio content-type: el
    # mime.types de nginx mapea .xml a text/xml, que sin charset cae a
    # us-ascii por RFC 3023 y pisa el "encoding=UTF-8" del propio documento.
    # No se generaliza a los sitemaps porque no son feeds.
    location = /rss.xml {
        # types{} vacio + default_type es el idioma de nginx para forzar un
        # tipo: sin vaciar la tabla, mime.types resuelve .xml a text/xml y
        # default_type nunca llega a aplicarse. Aqui vaciarla es inocuo
        # porque esta location sirve un unico fichero.
        types { }
        default_type application/rss+xml;
        # Las location exactas se evaluan aisladas: esta NO cae despues en la
        # regex de html|xml|json de abajo, asi que su cabecera de cache hay
        # que repetirla aqui o el feed se queda sin ninguna.
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # .webmanifest no esta en el mime.types de nginx. Se resuelve con una
    # location y no con un bloque types{}: un types{} declarado en un contexto
    # NO se fusiona con la tabla heredada, la SUSTITUYE, y dejaria todo lo
    # demas (html, css, js, svg...) cayendo a application/octet-stream. Con
    # nosniff activo eso hace que el navegador se niegue a aplicar el CSS y a
    # ejecutar el JS: el sitio entero se ve sin estilos.
    location = /site.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # /_astro/ y /ec/ llevan hash de contenido en el nombre: cambiar el
    # contenido cambia la URL, asi que un cache de un año sin revalidar es
    # seguro. Van con prefijo (^~) para que ganen a las location de regex de
    # abajo sin depender del orden de declaracion.
    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
    location ^~ /ec/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Todo lo demas con estas extensiones (theme-init.js, series-scroll.js,
    # favicons, public/static/...) no lleva hash en el nombre: un cambio de
    # contenido no cambia la URL, asi que "immutable" a un año esconderia la
    # actualizacion. TTL corto en su lugar.
    location ~* \.(?:css|js|woff2?|ttf|eot|png|jpe?g|gif|webp|avif|ico|svg)$ {
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    location ~* \.(?:html|xml|json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
