server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Sin esto, las redirecciones (p.ej. /blog -> /blog/ por try_files) se
    # construyen con $scheme y $server_port, que aqui son los internos
    # (http, 8080) y no los que ve el navegador a traves de Caddy. El
    # resultado es un Location: http://localhost:8080/... que el navegador
    # no puede alcanzar. Con la redireccion relativa, el navegador la
    # resuelve contra la URL que ya tiene delante.
    absolute_redirect off;

    # Nginx solo es alcanzable desde la red interna, y ahi el unico cliente es
    # Caddy. Confiar en los rangos privados permite que el log registre la IP
    # real del visitante en vez de la del proxy.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Ficheros ocultos: va primero porque las location de regex se evaluan en
    # orden y la primera que casa gana.
    location ~ /\. {
        deny all;
        access_log off;
    }

    location ~* \.(?:css|js|woff2?|ttf|eot|png|jpe?g|gif|webp|avif|ico|svg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location ~* \.(?:html|xml|json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
